<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Prisma Desenvolvimento</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#17191d;--line:#30343b;--text:#f4f4f2;--muted:#a6a9b0;--green:#9dd3ad;--red:#f0a5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{width:min(960px,calc(100% - 32px));margin:auto;padding:32px 0 60px}header,.toolbar,.head,.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header{margin-bottom:36px}.brand{font-weight:800;letter-spacing:-.04em}a{color:var(--muted)}h1{font-size:clamp(26px,5vw,36px);margin:0 0 8px}p{color:var(--muted);line-height:1.55}.panel,.review{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px}.login{max-width:430px;margin:8vh auto}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:13px;color:var(--muted)}input{padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}button{padding:11px 14px;border:0;border-radius:9px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#d6d9df;color:#17191d}.secondary{background:#292d34;color:white;border:1px solid #414650}.danger{background:#3b2427;color:#ffc4c4;border:1px solid #684044}button:disabled{opacity:.5}.status{font-size:13px;color:var(--muted);min-height:22px}.error{color:var(--red)}.ok{color:var(--green)}#reviews{display:grid;gap:14px;margin-top:14px}.name{font-weight:700}.stars{color:#f1d38a;letter-spacing:2px;margin:8px 0}.date{font-size:12px;color:var(--muted)}.comment{white-space:pre-wrap;overflow-wrap:anywhere;color:#e4e5e7}.actions{justify-content:flex-start}.actions .status{margin-right:auto}[hidden]{display:none!important}@media(max-width:520px){.panel,.review{padding:17px}}
</style></head><body><main class="wrap"><header><div class="brand">PRISMA <span style="color:#a6a9b0;font-weight:400">/ administrativo</span></div><a href="/">Voltar ao site</a></header>
<section id="login" class="panel login"><h1>Acesso administrativo</h1><p>Entre com a conta autorizada da Prisma.</p><form id="login-form"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="login-btn" style="width:100%">Entrar</button></form><div id="login-status" class="status" role="status"></div></section>
<section id="dashboard" hidden><h1>Avaliações recebidas</h1><p>Aprove avaliações para publicá-las, retire a publicação ou exclua registros.</p><div class="toolbar"><div id="summary" class="status">Carregando...</div><div><button class="secondary" id="refresh">Atualizar</button> <button class="secondary" id="logout">Sair</button></div></div><div id="status" class="status" role="status"></div><div id="reviews"></div></section></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db=createClient("https://modmykuoqzdqbbazfmrw.supabase.co","sb_publishable_cSwOhR7F5dgRVnIyU4Rg4w_Jkz04dOE");
const $=id=>document.getElementById(id), login=$("login"),dash=$("dashboard");
function message(id,text,type=""){const e=$(id);e.textContent=text;e.className="status "+type}
function show(on){login.hidden=on;dash.hidden=!on}
function btn(text,cls,fn){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.onclick=fn;return b}
async function load(){message("status","Carregando avaliações...");$("reviews").replaceChildren();const {data,error}=await db.from("avaliacoes").select("id,nome,nota,comentario,aprovado,criado_em").order("criado_em",{ascending:false});if(error){message("status","Acesso negado ou erro ao carregar: "+error.message,"error");$("summary").textContent="Não foi possível carregar";return}const pending=data.filter(x=>!x.aprovado).length;$("summary").textContent=data.length+" avaliação(ões) · "+pending+" pendente(s)";if(!data.length){$("reviews").textContent="Nenhuma avaliação encontrada.";message("status","");return}for(const item of data){const card=document.createElement("article");card.className="review";const head=document.createElement("div");head.className="head";const identity=document.createElement("div");const name=document.createElement("div");name.className="name";name.textContent=item.nome;const stars=document.createElement("div");stars.className="stars";stars.textContent="★".repeat(item.nota)+"☆".repeat(5-item.nota);identity.append(name,stars);const date=document.createElement("span");date.className="date";date.textContent=new Date(item.criado_em).toLocaleString("pt-BR");head.append(identity,date);const comment=document.createElement("p");comment.className="comment";comment.textContent=item.comentario;const actions=document.createElement("div");actions.className="actions";const state=document.createElement("span");state.className="status "+(item.aprovado?"ok":"");state.textContent=item.aprovado?"Aprovada e publicada":"Aguardando aprovação";actions.append(state);actions.append(item.aprovado?btn("Retirar publicação","secondary",()=>approval(item.id,false)):btn("Aprovar avaliação","primary",()=>approval(item.id,true)));actions.append(btn("Excluir","danger",()=>remove(item.id)));card.append(head,comment,actions);$("reviews").append(card)}message("status","")}
async function approval(id,value){message("status","Salvando...");const {error}=await db.from("avaliacoes").update({aprovado:value}).eq("id",id);if(error){message("status","Falha ao atualizar: "+error.message,"error");return}await load();message("status",value?"Avaliação aprovada.":"Publicação retirada.","ok")}
async function remove(id){if(!confirm("Excluir esta avaliação permanentemente?"))return;const {error}=await db.from("avaliacoes").delete().eq("id",id);if(error){message("status","Falha ao excluir: "+error.message,"error");return}await load();message("status","Avaliação excluída.","ok")}
$("login-form").addEventListener("submit",async e=>{e.preventDefault();$("login-btn").disabled=true;message("login-status","Verificando acesso...");const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("login-btn").disabled=false;if(error){message("login-status","Não foi possível entrar. Confira seus dados.","error");return}show(true);await load()});
$("refresh").onclick=load;$("logout").onclick=async()=>{await db.auth.signOut();show(false);$("login-form").reset();message("login-status","Você saiu do painel.")};
const {data:{session}}=await db.auth.getSession();if(session){show(true);await load()}
</script></body></html>
