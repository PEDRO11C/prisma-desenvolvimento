<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel administrativo | Prisma</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{color-scheme:dark;--bg:#0a0b0e;--panel:#13151a;--line:#292d36;--text:#f3f4f6;--muted:#9299a6;--accent:#c5a7ff;--green:#80d6a3;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui, sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:17px}.brand{font-weight:850;letter-spacing:1px}.brand i{font-style:normal;color:var(--accent);font-size:24px;margin-right:8px}.login h1{font-size:25px;margin:24px 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;color:var(--muted)}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0a0b0e;color:white}.btn{padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:#20232b;color:white;font-weight:650}.primary{background:var(--accent);color:#17121f;border-color:var(--accent)}.danger{color:var(--red)}.good{color:var(--green)}.error{color:var(--red);font-size:12px;min-height:18px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#0e1014;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:28px}.navlabel{color:#737b89;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:0 10px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#aeb4c0;text-align:left;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#20212a;color:white}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.main{min-width:0}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1400px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.heading h1{font-size:27px;margin:0 0 6px}.heading p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat,.panel,.module{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:12px 0 4px}.panel{margin-top:16px}.panel h2{font-size:15px;margin:0 0 15px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module b{display:block;margin:0 0 7px}.module p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;color:var(--muted);text-transform:uppercase}td{vertical-align:top}.status{display:inline-block;padding:5px 8px;border-radius:20px;background:#28251b;color:#e9c77e;font-size:10px}.status.ok{background:#17291f;color:var(--green)}.stars{color:#f1c86e;letter-spacing:2px}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px 14px;background:#211d15;border:1px solid #4b3d26;border-radius:9px;color:#e8ca8f;font-size:12px;line-height:1.6;margin-bottom:15px}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;inset:0 auto 0 0;width:245px;transform:translateX(-105%);transition:.2s}.side.open{transform:translateX(0)}.mobile{display:inline-block}.content{padding:22px 16px}.top{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.modules{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section id="login" class="login"><div class="loginbox"><div class="brand"><i>P.</i> PRISMA <span class="muted">DESENVOLVIMENTO</span></div><h1>Painel administrativo</h1><p class="muted">Acesso exclusivo à equipe autorizada.</p><form id="login-form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Entrar</button><div id="login-error" class="error"></div></form></div></section>
<div id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><i>P.</i> PRISMA <span class="muted">ADMIN</span></div><div><div class="navlabel">Gestão</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">⌂　Dashboard</button><button data-page="clientes">♙　Clientes</button><button data-page="projetos">▧　Projetos</button><button data-page="financeiro">＄　Financeiro</button><button data-page="avaliacoes">★　Avaliações <span id="pending" class="status">0</span></button><button data-page="mensagens">✉　Mensagens</button><button data-page="notificacoes">♧　Notificações</button><button data-page="configuracoes">⚙　Configurações</button></nav></div><div class="sidefoot"><div id="who" class="muted" style="font-size:11px;overflow-wrap:anywhere"></div><button id="logout" class="btn" style="width:100%;margin-top:12px">Sair</button></div></aside><main class="main"><header class="top"><div><button id="menu" class="btn mobile">☰</button> <span class="muted">Prisma / <b id="crumb">Dashboard</b></span></div><span class="muted">Área administrativa</span></header><div id="view" class="content"></div></main></div>
<script>
const db=window.supabase.createClient('https://modmykuoqzdqbbazfmrw.supabase.co','sb_publishable_cSwOhR7F5dgRVnIyU4Rg4w_Jkz04dOE');
const $=id=>document.getElementById(id);let user=null, reviews=[], clients=[];
const labels={dashboard:['Visão geral','Resumo da operação da Prisma.'],clientes:['Clientes','Cadastro e relacionamento com clientes.'],projetos:['Projetos','Acompanhamento de etapas e entregas.'],financeiro:['Financeiro','Controle de valores e recebimentos.'],avaliacoes:['Avaliações','Moderação dos depoimentos enviados pelo site.'],mensagens:['Mensagens','Contatos e solicitações recebidas.'],notificacoes:['Notificações','Avisos e atualizações do sistema.'],configuracoes:['Configurações','Preferências e dados administrativos.']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadReviews(){const {data,error}=await db.from('avaliacoes').select('id,nome,nota,comentario,criado_em,aprovado').order('criado_em',{ascending:false});if(error)throw error;reviews=data||[];$('pending').textContent=reviews.filter(r=>!r.aprovado).length;}
async function loadClients(){const {data,error}=await db.from('clientes').select('id,nome,email,telefone,empresa,servico_interesse,status,observacoes,criado_em,atualizado_em').order('criado_em',{ascending:false});if(error)throw error;clients=data||[];}
function clientsView(){
 const rows=clients.length?'<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Contato</th><th>Empresa</th><th>Interesse</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+clients.map(c=>'<tr><td><b>'+esc(c.nome)+'</b></td><td>'+esc(c.email||'—')+'<br>'+esc(c.telefone||'')+'</td><td>'+esc(c.empresa||'—')+'</td><td>'+esc(c.servico_interesse||'—')+'</td><td><span class="status '+(c.status==='ativo'?'ok':'')+'">'+(c.status==='lead'?'Lead':c.status==='ativo'?'Ativo':'Inativo')+'</span></td><td><div class="actions"><button class="btn" data-client-edit="'+c.id+'">Editar</button><button class="btn danger" data-client-delete="'+c.id+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum cliente cadastrado ainda.</div>';
 return '<section class="panel"><h2 id="client-form-title">Cadastrar cliente</h2><form id="client-form"><input type="hidden" name="id" id="client-id"><div class="form-layout"><div class="field"><label for="client-name">Nome *</label><input id="client-name" name="nome" maxlength="120" required></div><div class="field"><label for="client-email">E-mail</label><input id="client-email" name="email" type="email" maxlength="180"></div><div class="field"><label for="client-phone">Telefone / WhatsApp</label><input id="client-phone" name="telefone" maxlength="40"></div><div class="field"><label for="client-company">Empresa</label><input id="client-company" name="empresa" maxlength="140"></div><div class="field"><label for="client-service">Serviço de interesse</label><input id="client-service" name="servico_interesse" maxlength="160"></div><div class="field"><label for="client-status">Situação</label><select id="client-status" name="status"><option value="lead">Lead</option><option value="ativo">Cliente ativo</option><option value="inativo">Inativo</option></select></div></div><div class="field"><label for="client-notes">Observações</label><textarea id="client-notes" name="observacoes" maxlength="2000" rows="3"></textarea></div><div class="actions"><button class="btn primary" type="submit">Salvar cliente</button><button class="btn" type="button" id="client-cancel" style="display:none">Cancelar edição</button><span id="client-error" class="error"></span></div></form></section><section class="panel"><div class="heading"><h2>Clientes cadastrados ('+clients.length+')</h2><button id="clients-refresh" class="btn">Atualizar</button></div>'+rows+'</section>';
}
function resetClientForm(){const form=$('client-form');if(!form)return;form.reset();$('client-id').value='';$('client-form-title').textContent='Cadastrar cliente';$('client-cancel').style.display='none';}
function stats(){let pub=reviews.filter(r=>r.aprovado),avg=pub.length?(pub.reduce((s,r)=>s+Number(r.nota||0),0)/pub.length).toFixed(1):'—';return '<div class="stats">'+[['Avaliações recebidas',reviews.length],['Pendentes',reviews.filter(r=>!r.aprovado).length],['Publicadas',pub.length],['Nota média',avg]].map(x=>'<article class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></article>').join('')+'</div>';}
function table(rows){if(!rows.length)return '<div class="empty">Nenhuma avaliação encontrada.</div>';return '<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Nota</th><th>Comentário</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.nome)+'</b></td><td class="stars">'+('★'.repeat(Math.max(0,Math.min(5,Number(r.nota)||0))))+'</td><td>'+esc(r.comentario)+'</td><td>'+ (r.criado_em?new Date(r.criado_em).toLocaleDateString('pt-BR'):'—')+'</td><td><span class="status '+(r.aprovado?'ok':'')+'">'+(r.aprovado?'Publicada':'Pendente')+'</span></td><td><div class="actions">'+(!r.aprovado?'<button class="btn good" data-act="approve" data-id="'+r.id+'">Aprovar</button>':'<button class="btn" data-act="hide" data-id="'+r.id+'">Ocultar</button>')+'<button class="btn danger" data-act="delete" data-id="'+r.id+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div>';}
function render(key){let [title,desc]=labels[key];$('crumb').textContent=title;$('nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));let body='';
if(key==='dashboard'){body=stats()+'<section class="panel"><h2>Últimas avaliações recebidas</h2>'+table(reviews.slice(0,5))+'</section><section class="panel"><h2>Módulos do sistema</h2><div class="modules">'+[['Clientes','Cadastro e histórico de atendimento.'],['Projetos','Etapas, status e prazos.'],['Financeiro','Valores e pagamentos.'],['Mensagens','Solicitações e contatos.'],['Notificações','Avisos e atualizações.'],['Configurações','Preferências administrativas.']].map(x=>'<article class="module"><b>'+x[0]+'</b><p>'+x[1]+'</p></article>').join('')+'</div></section>';}
else if(key==='clientes'){body='<div class="stats"><article class="stat"><span>Total de registros</span><strong>'+clients.length+'</strong></article><article class="stat"><span>Leads</span><strong>'+clients.filter(c=>c.status==='lead').length+'</strong></article><article class="stat"><span>Ativos</span><strong>'+clients.filter(c=>c.status==='ativo').length+'</strong></article><article class="stat"><span>Inativos</span><strong>'+clients.filter(c=>c.status==='inativo').length+'</strong></article></div>'+clientsView();}
else if(key==='avaliacoes'){body='<div class="notice">Somente avaliações aprovadas aparecem no site público. Ações de moderação são protegidas pelas políticas RLS configuradas no Supabase.</div>'+stats()+'<section class="panel"><div class="heading"><h2>Todas as avaliações</h2><button id="refresh" class="btn">Atualizar</button></div><div class="actions" style="margin-bottom:14px"><button class="btn" data-filter="all">Todas</button><button class="btn" data-filter="pending">Pendentes</button><button class="btn" data-filter="approved">Publicadas</button></div><div id="review-table">'+table(reviews)+'</div></section>';}
else{body='<section class="panel"><h2>'+title+'</h2><p class="muted">A estrutura deste módulo está preparada na navegação do painel. A conexão com dados será ativada depois de definir as tabelas, campos e permissões específicas no Supabase, mantendo os dados dos clientes protegidos.</p><span class="status">Estrutura inicial</span></section>';}
$('view').innerHTML='<div class="heading"><div><h1>'+title+'</h1><p>'+desc+'</p></div></div>'+body;}
async function refresh(){await loadReviews();await loadClients();let active=$('nav').querySelector('.active')?.dataset.page||'dashboard';render(active);}
async function moderate(id,approved,remove,button){if(!id){alert('Não foi possível identificar esta avaliação. Atualize a página e tente novamente.');return;}const question=remove?'Excluir definitivamente esta avaliação?':approved?'Aprovar e publicar esta avaliação?':'Retirar esta avaliação do site?';if(!window.confirm(question))return;if(button){button.disabled=true;button.textContent='Processando...';}try{let result;if(remove){result=await db.from('avaliacoes').delete().eq('id',id).select('id').maybeSingle();}else{result=await db.from('avaliacoes').update({aprovado:approved}).eq('id',id).select('id,aprovado').maybeSingle();}if(result.error)throw result.error;if(!result.data){throw new Error('Nenhuma avaliação foi alterada. Verifique se ela ainda existe e se sua sessão continua ativa.');}await refresh();}catch(error){alert('Não foi possível concluir a ação: '+(error?.message||'erro desconhecido'));if(button){button.disabled=false;button.textContent=remove?'Excluir':approved?'Aprovar':'Ocultar';}}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-error').textContent='';let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('login-error').textContent='Falha no acesso. Confira e-mail, senha e autorização.';return;}await init();});
$('logout').onclick=async()=>{await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');};
$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){render(b.dataset.page);$('side').classList.remove('open');}};
document.addEventListener('click',async e=>{
 const edit=e.target.closest('#view [data-client-edit]');
 if(edit){const c=clients.find(x=>x.id===edit.dataset.clientEdit);if(!c)return;$('client-id').value=c.id;$('client-name').value=c.nome||'';$('client-email').value=c.email||'';$('client-phone').value=c.telefone||'';$('client-company').value=c.empresa||'';$('client-service').value=c.servico_interesse||'';$('client-status').value=c.status||'lead';$('client-notes').value=c.observacoes||'';$('client-form-title').textContent='Editar cliente';$('client-cancel').style.display='inline-block';$('client-name').focus();return;}
 const del=e.target.closest('#view [data-client-delete]');
 if(del){const c=clients.find(x=>x.id===del.dataset.clientDelete);if(!c||!confirm('Excluir o cadastro de '+c.nome+'?'))return;const {error}=await db.from('clientes').delete().eq('id',c.id);if(error){alert('Não foi possível excluir: '+error.message);return;}await refresh();return;}
 if(e.target.closest('#view #client-cancel')){resetClientForm();return;}
 if(e.target.closest('#view #clients-refresh')){try{await loadClients();render('clientes');}catch(error){alert('Erro ao atualizar clientes: '+error.message);}return;}
 const a=e.target.closest('#view [data-act]');if(a){e.preventDefault();e.stopPropagation();await moderate(a.dataset.id,a.dataset.act==='approve',a.dataset.act==='delete',a);return;}const f=e.target.closest('#view [data-filter]');if(f){const k=f.dataset.filter;const rows=k==='pending'?reviews.filter(r=>!r.aprovado):k==='approved'?reviews.filter(r=>r.aprovado):reviews;$('review-table').innerHTML=table(rows);return;}if(e.target.closest('#view #refresh')){e.preventDefault();try{await refresh();}catch(error){alert('Erro ao atualizar: '+error.message);}}});
$('menu').onclick=()=>$('side').classList.toggle('open');
document.addEventListener('submit',async e=>{if(!e.target||e.target.id!=='client-form')return;e.preventDefault();e.stopPropagation();const form=e.target;const button=form.querySelector('button[type="submit"]');const errorBox=$('client-error');if(button){button.disabled=true;button.textContent='Salvando...';}errorBox.textContent='Salvando cliente...';try{const values=Object.fromEntries(new FormData(form).entries());const id=values.id;delete values.id;values.nome=(values.nome||'').trim();values.email=(values.email||'').trim()||null;values.telefone=(values.telefone||'').trim()||null;values.empresa=(values.empresa||'').trim()||null;values.servico_interesse=(values.servico_interesse||'').trim()||null;values.observacoes=(values.observacoes||'').trim()||null;values.atualizado_em=new Date().toISOString();const result=id?await db.from('clientes').update(values).eq('id',id).select('id').maybeSingle():await db.from('clientes').insert(values).select('id').maybeSingle();if(result.error)throw result.error;if(!result.data)throw new Error('O banco não confirmou a gravação. Confira sua sessão e as permissões.');await loadClients();render('clientes');}catch(error){errorBox.textContent='Não foi possível salvar: '+(error?.message||'erro desconhecido');if(button){button.disabled=false;button.textContent='Salvar cliente';}}},true);
async function init(){let {data:{user:u}}=await db.auth.getUser();if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}user=u;$('who').textContent=u.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await loadReviews();await loadClients();render('dashboard');}catch(e){render('dashboard');$('view').insertAdjacentHTML('afterbegin','<div class="notice">Não foi possível carregar as avaliações: '+esc(e.message)+'. Configure a tabela e as permissões do Supabase.</div>');}}
db.auth.onAuthStateChange((_event,session)=>{if(!session){$('app').classList.add('hidden');$('login').classList.remove('hidden');}});init();
</script></body></html>
