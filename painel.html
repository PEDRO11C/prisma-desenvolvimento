<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel administrativo | Prisma</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

h:1400px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.heading h1{font-size:27px;margin:0 0 6px}.heading p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat,.panel,.module{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:12px 0 4px}.panel{margin-top:16px}.panel h2{font-size:15px;margin:0 0 15px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module b{display:block;margin:0 0 7px}.module p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0a0b0e;color:white;font:inherit}textarea{resize:vertical;min-height:90px}.form-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.field{min-width:0}@media(max-width:600px){.form-layout{grid-template-columns:1fr}}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;color:var(--muted);text-transform:uppercase}td{vertical-align:top}.status{display:inline-block;padding:5px 8px;border-radius:20px;background:#28251b;color:#e9c77e;font-size:10px}.status.ok{background:#17291f;color:var(--green)}.stars{color:#f1c86e;letter-spacing:2px}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px 14px;background:#211d15;border:1px solid #4b3d26;border-radius:9px;color:#e8ca8f;font-size:12px;line-height:1.6;margin-bottom:15px}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;inset:0 auto 0 0;width:245px;transform:translateX(-105%);transition:.2s}.side.open{transform:translateX(0)}.mobile{display:inline-block}.content{padding:22px 16px}.top{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.modules{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}

<section id="login" class="login"><div class="loginbox"><div class="brand"><i>P.</i> PRISMA <span class="muted">DESENVOLVIMENTO</span></div><h1>Painel administrativo</h1><p class="muted">Acesso exclusivo à equipe autorizada.</p><form id="login-form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Entrar</button><div id="login-error" class="error"></div></form></div></section>
<div id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><i>P.</i> PRISMA <span class="muted">ADMIN</span></div><div><div class="navlabel">Gestão</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">⌂　Dashboard</button><button data-page="clientes">♙　Clientes</button><button data-page="projetos">▧　Projetos</button><button data-page="financeiro">＄　Financeiro</button><button data-page="despesas">▤　Despesas</button><button data-page="avaliacoes">★　Avaliações <span id="pending" class="status">0</span></button><button data-page="mensagens">✉　Mensagens</button><button data-page="notificacoes">♧　Notificações</button><button data-page="configuracoes">⚙　Configurações</button></nav></div><div class="sidefoot"><div id="who" class="muted" style="font-size:11px;overflow-wrap:anywhere"></div><button id="logout" class="btn" style="width:100%;margin-top:12px">Sair</button></div></aside><main class="main"><header class="top"><div><button id="menu" class="btn mobile">☰</button> <span class="muted">Prisma / <b id="crumb">Dashboard</b></span></div><span class="muted">Área administrativa</span></header><div id="view" class="content"></div></main></div>
<script>
const db=window.supabase.createClient('https://modmykuoqzdqbbazfmrw.supabase.co','sb_publishable_cSwOhR7F5dgRVnIyU4Rg4w_Jkz04dOE');
const $=id=>document.getElementById(id);let user=null, reviews=[], clients=[], projects=[], receivables=[], expenses=[];
const labels={dashboard:['Visão geral','Resumo da operação da Prisma.'],clientes:['Clientes','Cadastro e relacionamento com clientes.'],projetos:['Projetos','Acompanhamento de etapas e entregas.'],financeiro:['Financeiro','Controle de valores e recebimentos.'],despesas:['Despesas','Controle de custos e pagamentos da Prisma.'],avaliacoes:['Avaliações','Moderação dos depoimentos enviados pelo site.'],mensagens:['Mensagens','Contatos e solicitações recebidas.'],notificacoes:['Notificações','Avisos e atualizações do sistema.'],configuracoes:['Configurações','Preferências e dados administrativos.']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadReviews(){const {data,error}=await db.from('avaliacoes').select('id,nome,nota,comentario,criado_em,aprovado').order('criado_em',{ascending:false});if(error)throw error;reviews=data||[];$('pending').textContent=reviews.filter(r=>!r.aprovado).length;}
async function loadClients(){const {data,error}=await db.from('clientes').select('id,nome,email,telefone,empresa,servico_interesse,status,observacoes,criado_em,atualizado_em').order('criado_em',{ascending:false});if(error)throw error;clients=data||[];}
async function loadProjects(){const {data,error}=await db.from('projetos').select('id,cliente_id,nome,descricao,servico,valor,data_inicio,prazo_entrega,status,observacoes,criado_em,atualizado_em,clientes(nome)').order('criado_em',{ascending:false});if(error)throw error;projects=data||[];}
async function loadReceivables(){const {data,error}=await db.from('recebimentos').select('id,projeto_id,descricao,valor,vencimento,data_pagamento,status,forma_pagamento,observacoes,criado_em,atualizado_em,projetos(nome,clientes(nome))').order('vencimento',{ascending:true,nullsFirst:false}).order('criado_em',{ascending:false});if(error)throw error;receivables=data||[];}\nasync function loadExpenses(){const {data,error}=await db.from('despesas').select('id,projeto_id,descricao,categoria,valor,vencimento,data_pagamento,status,forma_pagamento,observacoes,criado_em,atualizado_em,projetos(nome,clientes(nome))').order('vencimento',{ascending:true,nullsFirst:false}).order('criado_em',{ascending:false});if(error)throw error;expenses=data||[];}
function clientsView(){
 const rows=clients.length?'<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Contato</th><th>Empresa</th><th>Interesse</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+clients.map(c=>'<tr><td><b>'+esc(c.nome)+'</b></td><td>'+esc(c.email||'—')+'<br>'+esc(c.telefone||'')+'</td><td>'+esc(c.empresa||'—')+'</td><td>'+esc(c.servico_interesse||'—')+'</td><td><span class="status '+(c.status==='ativo'?'ok':'')+'">'+(c.status==='lead'?'Lead':c.status==='ativo'?'Ativo':'Inativo')+'</span></td><td><div class="actions"><button class="btn" data-client-edit="'+c.id+'">Editar</button><button class="btn danger" data-client-delete="'+c.id+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum cliente cadastrado ainda.</div>';
 return '<section class="panel"><h2 id="client-form-title">Cadastrar cliente</h2><form id="client-form"><input type="hidden" name="id" id="client-id"><div class="form-layout"><div class="field"><label for="client-name">Nome *</label><input id="client-name" name="nome" maxlength="120" required></div><div class="field"><label for="client-email">E-mail</label><input id="client-email" name="email" type="email" maxlength="180"></div><div class="field"><label for="client-phone">Telefone / WhatsApp</label><input id="client-phone" name="telefone" maxlength="40"></div><div class="field"><label for="client-company">Empresa</label><input id="client-company" name="empresa" maxlength="140"></div><div class="field"><label for="client-service">Serviço de interesse</label><input id="client-service" name="servico_interesse" maxlength="160"></div><div class="field"><label for="client-status">Situação</label><select id="client-status" name="status"><option value="lead">Lead</option><option value="ativo">Cliente ativo</option><option value="inativo">Inativo</option></select></div></div><div class="field"><label for="client-notes">Observações</label><textarea id="client-notes" name="observacoes" maxlength="2000" rows="3"></textarea></div><div class="actions"><button class="btn primary" type="button" id="client-save">Salvar cliente</button><button class="btn" type="button" id="client-cancel" style="display:none">Cancelar edição</button><span id="client-error" class="error"></span></div></form></section><section class="panel"><div class="heading"><h2>Clientes cadastrados ('+clients.length+')</h2><button id="clients-refresh" class="btn">Atualizar</button></div>'+rows+'</section>';
}
function resetClientForm(){const form=$('client-form');if(!form)return;form.reset();$('client-id').value='';$('client-form-title').textContent='Cadastrar cliente';$('client-cancel').style.display='none';}

function projectStatusLabel(status){return ({orcamento:'Orçamento',aguardando_aprovacao:'Aguardando aprovação',em_andamento:'Em andamento',concluido:'Concluído',cancelado:'Cancelado'})[status]||status;}
function money(value){return Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function dateLabel(value){return value?new Date(value+'T12:00:00').toLocaleDateString('pt-BR'):'—';}
function projectsView(){
 const options=clients.map(c=>'<option value="'+c.id+'">'+esc(c.nome)+(c.empresa?' — '+esc(c.empresa):'')+'</option>').join('');
 const rows=projects.length?'<div class="tablewrap"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Prazo</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+projects.map(p=>'<tr><td><b>'+esc(p.nome)+'</b></td><td>'+esc(p.clientes?.nome||'Cliente não encontrado')+'</td><td>'+esc(p.servico||'—')+'</td><td>'+money(p.valor)+'</td><td>'+dateLabel(p.prazo_entrega)+'</td><td><span class="status '+(p.status==='concluido'?'ok':'')+'">'+projectStatusLabel(p.status)+'</span></td><td><div class="actions"><button class="btn" data-project-edit="'+p.id+'">Editar</button><button class="btn danger" data-project-delete="'+p.id+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum projeto cadastrado ainda. Use o formulário para adicionar o primeiro.</div>';
 return '<section class="panel"><h2 id="project-form-title">Cadastrar projeto</h2>'+(clients.length?'':'<div class="notice">Cadastre pelo menos um cliente antes de criar um projeto.</div>')+'<form id="project-form"><input type="hidden" name="id" id="project-id"><div class="form-layout"><div class="field"><label for="project-name">Nome do projeto *</label><input id="project-name" name="nome" maxlength="160" required></div><div class="field"><label for="project-client">Cliente *</label><select id="project-client" name="cliente_id" required><option value="">Selecione um cliente</option>'+options+'</select></div><div class="field"><label for="project-service">Serviço contratado</label><input id="project-service" name="servico" maxlength="160"></div><div class="field"><label for="project-value">Valor combinado (R$)</label><input id="project-value" name="valor" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="project-start">Data de início</label><input id="project-start" name="data_inicio" type="date"></div><div class="field"><label for="project-deadline">Prazo de entrega</label><input id="project-deadline" name="prazo_entrega" type="date"></div><div class="field"><label for="project-status">Status</label><select id="project-status" name="status"><option value="orcamento">Orçamento</option><option value="aguardando_aprovacao">Aguardando aprovação</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></div></div><div class="field"><label for="project-description">Descrição</label><textarea id="project-description" name="descricao" maxlength="2000" rows="3"></textarea></div><div class="field"><label for="project-notes">Observações internas</label><textarea id="project-notes" name="observacoes" maxlength="2000" rows="2"></textarea></div><div class="actions"><button class="btn primary" type="button" id="project-save" '+(clients.length?'':'disabled')+'>Salvar projeto</button><button class="btn" type="button" id="project-cancel" style="display:none">Cancelar edição</button><span id="project-error" class="error"></span></div></form></section><section class="panel"><div class="heading"><h2>Projetos cadastrados ('+projects.length+')</h2><button id="projects-refresh" class="btn">Atualizar</button></div>'+rows+'</section>';
}
function resetProjectForm(){const form=$('project-form');if(!form)return;form.reset();$('project-id').value='';$('project-value').value='0';$('project-form-title').textContent='Cadastrar projeto';$('project-cancel').style.display='none';$('project-save').textContent='Salvar projeto';}
function financeStatusLabel(status){return ({pendente:'Pendente',recebido:'Recebido',cancelado:'Cancelado'})[status]||status;}
function localToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function financeView(){
 const today=localToday();
 const received=receivables.filter(r=>r.status==='recebido').reduce((sum,r)=>sum+Number(r.valor||0),0);
 const pending=receivables.filter(r=>r.status==='pendente').reduce((sum,r)=>sum+Number(r.valor||0),0);
 const overdue=receivables.filter(r=>r.status==='pendente'&&r.vencimento&&r.vencimento<today).reduce((sum,r)=>sum+Number(r.valor||0),0);
 const options=projects.map(p=>'<option value="'+p.id+'">'+esc(p.nome)+' — '+esc(p.clientes?.nome||'Cliente')+'</option>').join('');
 const rows=receivables.length?'<div class="tablewrap"><table><thead><tr><th>Lançamento</th><th>Projeto / Cliente</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Pagamento</th><th>Ações</th></tr></thead><tbody>'+receivables.map(r=>'<tr><td><b>'+esc(r.descricao)+'</b></td><td>'+esc(r.projetos?.nome||'Projeto não encontrado')+'<br><span class="muted">'+esc(r.projetos?.clientes?.nome||'')+'</span></td><td>'+money(r.valor)+'</td><td>'+dateLabel(r.vencimento)+'</td><td><span class="status '+(r.status==='recebido'?'ok':'')+'">'+financeStatusLabel(r.status)+'</span></td><td>'+esc(r.forma_pagamento||'—')+(r.data_pagamento?'<br><span class="muted">'+dateLabel(r.data_pagamento)+'</span>':'')+'</td><td><div class="actions"><button class="btn" data-finance-edit="'+r.id+'">Editar</button><button class="btn danger" data-finance-delete="'+r.id+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum recebimento cadastrado. Adicione a primeira parcela ou cobrança.</div>';
 return '<div class="notice">Este módulo controla recebimentos por projeto. Você pode cadastrar várias parcelas para o mesmo projeto. O módulo Despesas permite acompanhar os custos e pagamentos da operação.</div><div class="stats"><article class="stat"><span>Total recebido</span><strong>'+money(received)+'</strong></article><article class="stat"><span>A receber</span><strong>'+money(pending)+'</strong></article><article class="stat"><span>Em atraso</span><strong>'+money(overdue)+'</strong></article><article class="stat"><span>Lançamentos</span><strong>'+receivables.length+'</strong></article></div><section class="panel"><h2 id="finance-form-title">Registrar recebimento</h2>'+(projects.length?'':'<div class="notice">Cadastre um projeto antes de registrar recebimentos.</div>')+'<form id="finance-form"><input type="hidden" name="id" id="finance-id"><div class="form-layout"><div class="field"><label for="finance-description">Descrição / parcela *</label><input id="finance-description" name="descricao" maxlength="160" placeholder="Ex.: Entrada do projeto" required></div><div class="field"><label for="finance-project">Projeto *</label><select id="finance-project" name="projeto_id" required><option value="">Selecione um projeto</option>'+options+'</select></div><div class="field"><label for="finance-value">Valor (R$) *</label><input id="finance-value" name="valor" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="finance-due">Data de vencimento</label><input id="finance-due" name="vencimento" type="date"></div><div class="field"><label for="finance-status">Situação</label><select id="finance-status" name="status"><option value="pendente">Pendente</option><option value="recebido">Recebido</option><option value="cancelado">Cancelado</option></select></div><div class="field"><label for="finance-paid">Data do recebimento</label><input id="finance-paid" name="data_pagamento" type="date"></div><div class="field"><label for="finance-method">Forma de pagamento</label><select id="finance-method" name="forma_pagamento"><option value="">Não informado</option><option>Pix</option><option>Transferência</option><option>Cartão</option><option>Boleto</option><option>Dinheiro</option><option>Outro</option></select></div></div><div class="field"><label for="finance-notes">Observações</label><textarea id="finance-notes" name="observacoes" maxlength="2000" rows="2"></textarea></div><div class="actions"><button class="btn primary" type="button" id="finance-save" '+(projects.length?'':'disabled')+'>Salvar recebimento</button><button class="btn" type="button" id="finance-cancel" style="display:none">Cancelar edição</button><span id="finance-error" class="error"></span></div></form></section><section class="panel"><div class="heading"><h2>Recebimentos registrados ('+receivables.length+')</h2><button id="finance-refresh" class="btn">Atualizar</button></div>'+rows+'</section>';
